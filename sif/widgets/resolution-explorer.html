<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectral Resolution &amp; Fraunhofer In-Filling</title>
<style>
  :root{
    --bg:transparent; --panel:#ffffff; --hairline:#d9dee3;
    --text:#1d2530; --muted:#5b6773; --faint:#8a97a5;
    --solar:#a9791f; --hires:#c9b48a; --sif:#c92a5a; --sif-fill:rgba(201,42,90,0.12);
      --oco:#7a5cc4; --oco-fill:rgba(122,92,196,0.10);
}
  [data-theme="dark"][data-standalone]{--bg:#171c22}
  [data-theme="dark"]{
    --panel:#212831; --hairline:#1e2733;
    --text:#e8edf2; --muted:#8a97a5; --faint:#5b6773;
    --solar:#e0b64a; --hires:#5b5230; --sif:#ff5c8a; --sif-fill:rgba(255,92,138,0.14);
      --oco:#a48ae0; --oco-fill:rgba(164,138,224,0.13);
}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .widget{background:var(--panel);border:1px solid var(--hairline);border-radius:8px;overflow:hidden;max-width:960px;margin:0 auto}
  .head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid var(--hairline)}
  .key{display:flex;gap:14px;flex-wrap:wrap;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
  .key span{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .key i{width:16px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block}
  .hint{margin-left:auto;font:11px ui-monospace,Menlo,monospace;color:var(--faint)}
  .body{position:relative;padding:6px 6px 0}
  canvas{display:block;width:100%;touch-action:pan-y}
  .hover{position:absolute;pointer-events:none;display:none;z-index:3;font:11.5px ui-monospace,Menlo,monospace;color:var(--text);background:var(--panel);border:1px solid var(--hairline);border-radius:5px;padding:5px 8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;padding:14px 16px 8px;border-top:1px solid var(--hairline)}
  @media(max-width:600px){.controls{grid-template-columns:1fr}}
  .ctl label{display:flex;justify-content:space-between;align-items:baseline;font:11.5px ui-monospace,Menlo,monospace;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .ctl label output{color:var(--text);font-size:12.5px;text-transform:none;letter-spacing:0}
  input[type=range]{width:100%;appearance:none;height:3px;background:var(--hairline);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--sif);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--hairline);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--sif);border:3px solid var(--panel);cursor:pointer}
  input[type=range]:focus-visible{box-shadow:0 0 0 2px var(--sif)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;padding:2px 16px 10px}
  .preset{appearance:none;cursor:pointer;font:12px ui-monospace,Menlo,monospace;color:var(--muted);background:transparent;border:1px solid var(--hairline);padding:6px 10px;border-radius:99px}
  .preset:hover{color:var(--text)} .preset:focus-visible{outline:2px solid var(--sif);outline-offset:2px}
  .preset[aria-pressed="true"]{color:var(--text);border-color:var(--sif)}
  .readouts{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px 6px}
  .ro{font:11.5px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--hairline);border-radius:5px;padding:5px 9px}
  .ro b{color:var(--text);font-weight:600} .ro.em b{color:var(--sif)}
  .caption{padding:6px 16px 16px;color:var(--muted);font-size:13px;max-width:80ch}
</style>
</head>
<body>
<div class="widget">
  <div class="head">
    <div class="key">
      <span><i style="border-color:var(--hires)"></i>solar spectrum (native)</span>
      <span><i style="border-color:var(--solar)"></i>as the instrument sees it</span>
      <span><i style="border-color:var(--sif)"></i>in-filling from SIF</span>
      <span><i style="border-color:var(--oco);border-top-width:6px"></i>OCO-2 SIF windows</span>
    </div>
    <span class="hint">coarsen the resolution ↓</span>
  </div>
  <div class="body">
    <canvas id="cv" height="470" aria-label="Solar Fraunhofer lines at varying instrument resolution and the resulting SIF in-filling ratio"></canvas>
    <div class="hover" id="hv"></div>
  </div>
  <div class="controls">
    <div class="ctl">
      <label>Instrument resolution (FWHM) <output id="fwhmOut">0.10 nm</output></label>
      <input type="range" id="fwhm" min="0.04" max="0.5" step="0.01" value="0.10" aria-label="Spectral resolution FWHM in nm">
    </div>
    <div class="ctl">
      <label>Fluorescence offset (of continuum) <output id="sifOut">1.0%</output></label>
      <input type="range" id="sif" min="0" max="2" step="0.05" value="1.0" aria-label="SIF offset as percent of continuum">
    </div>
  </div>
  <div class="presets" id="presets" role="group" aria-label="Instrument resolution presets"></div>
  <div class="presets" style="padding-top:0">
    <button class="preset" id="subTgl" aria-pressed="false">subtract the flat offset</button>
  </div>
  <div class="readouts">
    <span class="ro">line depth here <b id="roD">—</b></span>
    <span class="ro">line-core transmission <b id="roT">—</b></span>
    <span class="ro">flat offset <b id="roO">—</b></span>
    <span class="ro em">usable in-filling <b id="roP">—</b></span>
    <span class="ro em">kept vs native <b id="roK">—</b></span>
  </div>
  <p class="caption" id="cap"></p>
</div>

<script>
"use strict";
/* ---- theme resolution -----------------------------------------------------
   Priority: an explicit ?theme= wins; otherwise follow the embedding page when
   we can see it (same-origin iframes, e.g. the Quarto site's light/dark
   toggle); otherwise follow the reader's OS preference; otherwise light.
   Re-resolves live, so the host page needs no JavaScript of its own. A
   cross-origin embed such as Caltech Sites simply falls through to the OS
   preference and then to light. */
const THEME_PARAM = new URLSearchParams(location.search).get("theme");
const DARK_MQ = window.matchMedia("(prefers-color-scheme: dark)");

function hostBackground(){
  try {
    if (window.parent === window) return null;
    const c = window.parent.getComputedStyle(window.parent.document.body).backgroundColor;
    if (!c || c === "transparent") return null;
    if (/rgba\(\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\)/.test(c)) return null;   // unset
    return c;
  } catch (e) { return null; }                         // cross-origin
}
function pageIsDark(){
  try {
    if (window.parent === window) return null;
    const d = window.parent.document;                  // throws when cross-origin
    if (d.body.classList.contains("quarto-dark")) return true;
    if (d.body.classList.contains("quarto-light")) return false;
    const bs = d.documentElement.getAttribute("data-bs-theme");
    return bs ? bs === "dark" : null;
  } catch (e) { return null; }                         // cross-origin: not our business
}
function resolveTheme(){
  const hosted = pageIsDark();
  const dark = THEME_PARAM ? THEME_PARAM === "dark" : (hosted === null ? DARK_MQ.matches : hosted);
  const root = document.documentElement;
  root.setAttribute("data-theme", dark ? "dark" : "light");
  /* Sit on the host page's own background rather than inventing one, so the card
     blends into whatever theme is around it instead of punching a darker hole in
     it. Cross-origin we cannot read it and fall back to the palette below. */
  const hb = hostBackground();
  if (hb) root.style.setProperty("--panel", hb); else root.style.removeProperty("--panel");
  // Standalone (not in an iframe) we must paint our own backdrop; embedded we stay
  // transparent so the host page's background shows through in either mode.
  if (window.parent === window) root.setAttribute("data-standalone", "");
}
resolveTheme();

function onThemeChange(cb){
  /* Quarto swaps stylesheets asynchronously, so the host background read at the
     instant the class flips is still the OLD one. Re-apply a couple of times as
     it settles, and treat a background change alone as worth redrawing. */
  const apply = () => {
    const root = document.documentElement;
    const beforeTheme = root.getAttribute("data-theme");
    const beforePanel = root.style.getPropertyValue("--panel");
    resolveTheme();
    if (root.getAttribute("data-theme") !== beforeTheme ||
        root.style.getPropertyValue("--panel") !== beforePanel) cb();
  };
  const rerun = () => { apply(); setTimeout(apply, 120); setTimeout(apply, 400); };
  DARK_MQ.addEventListener("change", rerun);
  try {
    if (window.parent !== window){
      const d = window.parent.document;
      new MutationObserver(rerun).observe(d.body, {attributes:true, attributeFilter:["class"]});
      new MutationObserver(rerun).observe(d.documentElement, {attributes:true, attributeFilter:["data-bs-theme"]});
    }
  } catch (e) { /* cross-origin: no toggle to watch */ }
}

/* -------- external data hook --------
   Ships with a synthetic solar spectrum. Pass ?data=URL to a native-resolution
   solar JSON { "window_nm":[lo,hi], "wl":[...nm ascending], "E0":[...continuum≈1] }
   and it replaces the spectrum. The ILS convolution stays client-side so the
   FWHM slider remains live. Silent fallback to synthetic on any failure. */
const DATA_URL = new URLSearchParams(location.search).get("data");

const css=getComputedStyle(document.documentElement), col=k=>css.getPropertyValue(k).trim();
let C;
function readPalette(){ C ={ hair:col("--hairline"),text:col("--text"),muted:col("--muted"),faint:col("--faint"),
  solar:col("--solar"),hires:col("--hires"),sif:col("--sif"),sifFill:col("--sif-fill"),
  panel:col("--panel"),oco:col("--oco"),ocoFill:col("--oco-fill") }; }
readPalette();

/* OCO-2 / OCO-3 SIF fitting microwindows, nm. APPROXIMATE — see README before
   quoting these; they are drawn to orient the reader, not as a spec. */
const OCO_WINDOWS=[[758.17,759.10],[769.62,770.28]];
function shadeOCO(ctx,px,top,bot,W,label){
  for (const [a,b] of OCO_WINDOWS){
    const x0=px(a), x1=px(b);
    if (x1<PADL || x0>W-PADR) continue;
    const l=Math.max(x0,PADL), r=Math.min(x1,W-PADR);
    ctx.fillStyle=C.ocoFill; ctx.fillRect(l,top,Math.max(r-l,1.5),bot-top);
  }
  if (label){
    ctx.fillStyle=C.oco; ctx.textAlign="center"; ctx.textBaseline="bottom";
    for (const [a,b] of OCO_WINDOWS){
      const mid=px((a+b)/2);
      if (mid>PADL+18 && mid<W-PADR-18) ctx.fillText(Math.round((a+b)/2)+" nm", mid, bot-4);
    }
  }
}

onThemeChange(() => { readPalette();
  if (typeof draw === 'function') draw();
  if (typeof readouts === 'function') readouts();
  if (typeof legend === 'function') legend(); });

/* Cursor marker: a filled dot riding the curve itself, haloed against the panel
   so it stays legible over a fill. Matches the OCO dashboard's hover behaviour. */
function hoverDot(ctx,x,y,color){
  ctx.beginPath(); ctx.arc(x,y,3.6,0,2*Math.PI);
  ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=1.6; ctx.strokeStyle=C.panel; ctx.stroke();
}

/* --- native disk-integrated solar spectrum over the ~750 nm window (Fig 7 region).
   Continuum = 1 minus Gaussian Fraunhofer lines. Synthetic but faithful in depth/width;
   swap in a real solar line list for production. --- */
/* The window is the OCO-2 SIF region: both fitting microwindows (around 758.6 and
   770 nm) plus enough continuum either side to see them in context. The synthetic
   line list below is only the offline fallback — the tutorial drives this widget
   from the real Toon solar spectrum via ?data=. */
let WL0=755.0, WL1=773.0, N=3000, dx=(WL1-WL0)/(N-1);
let wl=new Float64Array(N), E0=new Float64Array(N);
let CORE_WL=758.68;                            /* deepest line — anchors the marker and readouts */
const LINES=[ {c:758.68,depth:0.62,w:0.030},   /* inside the 757 nm microwindow */
              {c:758.23,depth:0.28,w:0.026},
              {c:759.02,depth:0.34,w:0.026},
              {c:769.90,depth:0.55,w:0.030},   /* inside the 771 nm microwindow */
              {c:770.11,depth:0.30,w:0.024},
              {c:756.10,depth:0.24,w:0.026},
              {c:757.20,depth:0.18,w:0.022},
              {c:761.40,depth:0.40,w:0.028},
              {c:763.05,depth:0.22,w:0.024},
              {c:765.80,depth:0.30,w:0.026},
              {c:767.35,depth:0.19,w:0.022},
              {c:771.85,depth:0.36,w:0.028},
              {c:772.60,depth:0.21,w:0.024} ];
for (let i=0;i<N;i++){ const x=WL0+i*dx; wl[i]=x;
  let e=1; for (const L of LINES){ const t=(x-L.c)/L.w; e-=L.depth*Math.exp(-t*t); }
  E0[i]=Math.max(0.02,e);
}

/* Gaussian convolution to instrument resolution */
let Sconv=E0.slice();
function convolve(fwhm){
  const sigma=fwhm/2.3548, half=Math.max(1,Math.ceil(3*sigma/dx));
  const ker=new Float64Array(2*half+1); let ks=0;
  for (let k=-half;k<=half;k++){ const g=Math.exp(-0.5*Math.pow(k*dx/sigma,2)); ker[k+half]=g; ks+=g; }
  for (let k=0;k<ker.length;k++) ker[k]/=ks;
  const out=new Float64Array(N);
  for (let i=0;i<N;i++){ let s=0; for (let k=-half;k<=half;k++){ let j=i+k; if(j<0)j=0; else if(j>=N)j=N-1; s+=E0[j]*ker[k+half]; } out[i]=s; }
  return out;
}
function Sat(x){ const f=(x-WL0)/dx; const i=Math.max(0,Math.min(N-2,Math.floor(f))), t=f-i; return Sconv[i]*(1-t)+Sconv[i+1]*t; }

const state={ fwhm:0.10, sif:0.01, sub:false };   // sif as fraction of continuum
Sconv=convolve(state.fwhm);

/* Real solar spectrum, resampled onto a uniform grid (the convolution assumes
   even spacing). Line cores are floored at 0.02 so the in-filling ratio stays finite. */
if (DATA_URL){
  fetch(DATA_URL).then(r=>r.json()).then(j=>{
    if (!j || !Array.isArray(j.wl) || !Array.isArray(j.E0)) return;
    if (j.wl.length<8 || j.wl.length!==j.E0.length) return;
    const lo=j.wl[0], hi=j.wl[j.wl.length-1];
    if (!(hi>lo)) return;
    const M=Math.min(4000,j.wl.length), step=(hi-lo)/(M-1);
    const nwl=new Float64Array(M), ne=new Float64Array(M);
    let k=0;
    for (let i=0;i<M;i++){
      const x=lo+i*step; nwl[i]=x;
      while (k<j.wl.length-2 && j.wl[k+1]<x) k++;
      const span=j.wl[k+1]-j.wl[k], t=span>0?(x-j.wl[k])/span:0;
      ne[i]=Math.max(0.02, j.E0[k]+t*(j.E0[k+1]-j.E0[k]));
    }
    /* Anchor the readouts on the deepest line INSIDE an OCO fitting window when the
       data covers one — that is the line the real retrieval leans on. Otherwise
       fall back to the deepest line anywhere in the window. */
    const inOCO = x => OCO_WINDOWS.some(([a,b]) => x>=a && x<=b);
    let cmin=Infinity, ci=-1;
    for (let i=0;i<M;i++) if (inOCO(nwl[i]) && ne[i]<cmin){ cmin=ne[i]; ci=i; }
    if (ci<0){ cmin=Infinity; for (let i=0;i<M;i++) if (ne[i]<cmin){ cmin=ne[i]; ci=i; } }
    WL0=lo; WL1=hi; N=M; dx=step; wl=nwl; E0=ne; CORE_WL=nwl[ci];
    Sconv=convolve(state.fwhm); draw(); readouts();
  }).catch(()=>{ /* keep synthetic fallback */ });
}

/* --- canvas: two stacked panels --- */
const cv=document.getElementById("cv"), hv=document.getElementById("hv");
const PADL=62,PADR=14,H=470;   /* PADL clears the 5-character ratio labels (1.017) */
const A={t:16,b:210}, B={t:250,b:H-38};   // panel regions (top: spectrum, bottom: ratio)
let hoverX=null;

function setup(){ const dpr=window.devicePixelRatio||1, w=cv.clientWidth||cv.parentElement.clientWidth-12;
  cv.width=Math.round(w*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx,W:w}; }
function xticks(min,max,n){ const s0=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(s0))); let st=mag;
  for (const s of [1,2,2.5,5,10]) if(s0<=s*mag){st=s*mag;break;} const o=[]; for(let v=Math.ceil(min/st)*st;v<=max+1e-9;v+=st)o.push(v); return o; }

function draw(){
  const {ctx,W}=setup();
  const px=x=>PADL+(x-WL0)/(WL1-WL0)*(W-PADL-PADR);
  ctx.clearRect(0,0,W,H);
  ctx.font="11px ui-monospace, Menlo, monospace";

  // ---------- TOP: solar spectrum ----------
  const aYmax=1.08, apy=v=>A.t+(1-v/aYmax)*(A.b-A.t);
  shadeOCO(ctx,px,A.t,A.b,W,true);
  ctx.strokeStyle=C.hair; ctx.fillStyle=C.faint; ctx.lineWidth=1;
  for (const t of [0,0.25,0.5,0.75,1.0]){ const y=apy(t);
    ctx.beginPath(); ctx.moveTo(PADL,y); ctx.lineTo(W-PADR,y); ctx.stroke();
    ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(t.toFixed(2),PADL-7,y); }
  ctx.fillStyle=C.muted; ctx.save(); ctx.translate(13,(A.t+A.b)/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign="center"; ctx.fillText("solar transmission",0,0); ctx.restore();
  ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillStyle=C.muted;
  /* panel titles shorten rather than overflow the canvas on narrow screens */
  const T=(long,short)=>W>640?long:short;
  ctx.fillText(T("① what the Sun emits vs. what the spectrometer records","① Sun vs. spectrometer"), PADL+2, A.t+2);

  // native (thin)
  ctx.beginPath(); for(let i=0;i<N;i++){ const x=wl[i]; i===0?ctx.moveTo(px(x),apy(E0[i])):ctx.lineTo(px(x),apy(E0[i])); }
  ctx.strokeStyle=C.hires; ctx.lineWidth=1; ctx.stroke();
  // convolved (bold)
  ctx.beginPath(); for(let i=0;i<N;i++){ const x=wl[i]; i===0?ctx.moveTo(px(x),apy(Sconv[i])):ctx.lineTo(px(x),apy(Sconv[i])); }
  ctx.strokeStyle=C.solar; ctx.lineWidth=1.9; ctx.stroke();
  // deep-line marker
  ctx.strokeStyle=C.solar; ctx.setLineDash([2,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(px(CORE_WL),A.t); ctx.lineTo(px(CORE_WL),A.b); ctx.stroke(); ctx.setLineDash([]);

  // ---------- BOTTOM: the in-filling signal ----------
  /* ratio(λ) = 1 + F/I(λ) is really two different things added together:
       a FLAT offset F/1 at the continuum level, which is degenerate with anything
         else that scales the whole spectrum — reflectance, aerosol, calibration —
         and therefore carries no retrievable information on its own; and
       a HIGH-FREQUENCY excess F·(1/I − 1), which is non-zero only where the solar
         line is deep.
     The retrieval lives entirely in the second term, and that is the term the
     instrument destroys as it smears the line. */
  const off = state.sif;
  const resid = i => off*(1/Sconv[i] - 1);
  let rmax=0; for (let i=0;i<N;i++){ const v=resid(i); if(v>rmax) rmax=v; }

  const sub = state.sub;
  const bval  = sub ? (i => resid(i)) : (i => 1+off+resid(i));
  const bbase = sub ? 0 : 1+off;
  const bHi   = sub ? Math.max(rmax*1.15, 2e-4) : Math.max(1+off+rmax*1.15, 1.004);
  const bLo   = sub ? -(rmax*0.10 + 2e-5) : 0.999;
  const bpy   = v=>B.t+(1-(v-bLo)/(bHi-bLo))*(B.b-B.t);
  const bfmt  = sub ? (v=>(v*1000).toFixed(1)) : (v=>v.toFixed(3));
  const bticks = [...new Set(sub ? [0, rmax/2, rmax] : [1.0, 1+off, 1+off+rmax])];

  shadeOCO(ctx,px,B.t,B.b,W,false);
  ctx.strokeStyle=C.hair; ctx.fillStyle=C.faint; ctx.lineWidth=1;
  for (const t of bticks){ const y=bpy(t);
    ctx.beginPath(); ctx.moveTo(PADL,y); ctx.lineTo(W-PADR,y); ctx.stroke();
    ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(bfmt(t),PADL-7,y); }
  ctx.fillStyle=C.muted; ctx.save(); ctx.translate(13,(B.t+B.b)/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign="center";
  ctx.fillText(sub?"in-filling above the offset (‰)":"(I₀＋SIF) / I₀",0,0); ctx.restore();
  ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillStyle=C.muted;
  ctx.fillText(sub ? T("② what is left once the flat offset is removed — this is the signal","② offset removed")
                   : T("② the in-filling signal — a flat offset plus sharp peaks","② the in-filling signal"),
               PADL+2, B.t+2);

  // shade only the excess above the offset: the part a retrieval can actually use
  ctx.beginPath(); ctx.moveTo(px(WL0),bpy(bbase));
  for(let i=0;i<N;i++) ctx.lineTo(px(wl[i]),bpy(bval(i)));
  ctx.lineTo(px(WL1),bpy(bbase)); ctx.closePath(); ctx.fillStyle=C.sifFill; ctx.fill();
  // the offset itself, drawn as a baseline so it reads as "not the signal"
  ctx.beginPath(); ctx.moveTo(PADL,bpy(bbase)); ctx.lineTo(W-PADR,bpy(bbase));
  ctx.setLineDash([5,4]); ctx.strokeStyle=C.faint; ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
  if (!sub && W>660){
    ctx.fillStyle=C.faint; ctx.textAlign="right"; ctx.textBaseline="bottom";
    ctx.fillText("flat offset — degenerate with reflectance", W-PADR-2, bpy(bbase)-4);
  }
  ctx.beginPath();
  for(let i=0;i<N;i++){ const X=px(wl[i]),Y=bpy(bval(i)); i===0?ctx.moveTo(X,Y):ctx.lineTo(X,Y); }
  ctx.strokeStyle=C.sif; ctx.lineWidth=1.9; ctx.stroke();

  // x-axis (shared, drawn under bottom panel)
  ctx.fillStyle=C.faint; ctx.textAlign="center"; ctx.textBaseline="top";
  const tk=xticks(WL0,WL1,6), tdec=(tk.length>1 && (tk[1]-tk[0])<1)?1:0;
  for (const t of tk){ const X=px(t);
    ctx.textAlign = X>W-PADR-16 ? "right" : (X<PADL+16 ? "left" : "center");   /* keep end labels on-canvas */
    ctx.fillText(t.toFixed(tdec),X,B.b+7); }
  ctx.textAlign="center";
  ctx.fillStyle=C.muted; ctx.fillText("wavelength (nm)",PADL+(W-PADL-PADR)/2,H-13);

  if (hoverX!==null && hoverX>=WL0 && hoverX<=WL1){
    const hx=px(hoverX); ctx.strokeStyle=C.faint; ctx.setLineDash([3,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hx,A.t); ctx.lineTo(hx,A.b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx,B.t); ctx.lineTo(hx,B.b); ctx.stroke(); ctx.setLineDash([]);
    const s=Sat(hoverX);
    const f=(hoverX-WL0)/dx, i=Math.max(0,Math.min(N-2,Math.floor(f))), t=f-i;
    hoverDot(ctx,hx,apy(E0[i]*(1-t)+E0[i+1]*t),C.hires);   /* native */
    hoverDot(ctx,hx,apy(s),C.solar);                        /* convolved */
    const rh=off*(1/s-1);
    hoverDot(ctx,hx,bpy(sub?rh:1+off+rh),C.sif);            /* in-filling */
  }
}

function readouts(){
  const core = Sat(CORE_WL);                          // line core AS THE INSTRUMENT SEES IT
  const ci   = Math.max(0, Math.min(N-1, Math.round((CORE_WL-WL0)/dx)));
  const native = E0[ci];                              // the same core before the ILS
  const usable = state.sif*(1/core   - 1);            // excess above the flat offset
  const best   = state.sif*(1/native - 1);            // the most any instrument could see
  document.getElementById("roD").textContent = ((1-core)*100).toFixed(1)+"%";
  document.getElementById("roT").textContent = (core*100).toFixed(0)+"%";
  document.getElementById("roO").textContent = (state.sif*100).toFixed(2)+"%";
  document.getElementById("roP").textContent = (usable*1000).toFixed(2)+"‰";
  document.getElementById("roK").textContent = best>0 ? ((usable/best)*100).toFixed(0)+"%" : "—";
  const cap=document.getElementById("cap");
  if (state.sif<0.001)
    cap.textContent="With no fluorescence the ratio is flat at 1: reflected sunlight reproduces the solar line depths exactly, whatever the surface or atmosphere. Add SIF to break that.";
  else
    cap.textContent="The ratio is two different things added together. One is a flat offset — SIF divided by the continuum — which lifts the whole curve and is indistinguishable from anything else that scales the spectrum, so on its own it tells a retrieval nothing. The other is the extra bump on top of that offset, SIF·(1/I − 1), which exists only where the solar line is deep. That second part is the entire measurement. Now coarsen the resolution: the instrument smears the line, its core rises toward the continuum, and the bump collapses — while the flat offset does not move at all. Watch \u201ckept vs native\u201d fall as you drag, and note how much shallower the line has become. That is the real reason SIF retrievals need high spectral resolution.";
}

const subTgl=document.getElementById("subTgl");
subTgl.addEventListener("click",()=>{ state.sub=!state.sub;
  subTgl.setAttribute("aria-pressed",String(state.sub));
  subTgl.textContent=state.sub?"show the full ratio":"subtract the flat offset";
  draw(); });

const fwhmEl=document.getElementById("fwhm"), sifEl=document.getElementById("sif");
fwhmEl.addEventListener("input",()=>{ state.fwhm=+fwhmEl.value; document.getElementById("fwhmOut").textContent=state.fwhm.toFixed(2)+" nm"; Sconv=convolve(state.fwhm); draw(); readouts(); });
sifEl.addEventListener("input",()=>{ state.sif=(+sifEl.value)/100; document.getElementById("sifOut").textContent=(+sifEl.value).toFixed(1)+"%"; draw(); readouts(); });

/* The four resolutions used in the book chapter's own figure (SIF-modelling
   notebook, cell 11). Instrument names are deliberately NOT attached: the
   notebook labels these by resolution only, and the memo asked for instrument
   numbers to be confirmed against it before publishing. See README. */
const PRESETS=[ ["0.07 nm",0.07], ["0.11 nm",0.11], ["0.25 nm",0.25], ["0.50 nm",0.50] ];
const wrap=document.getElementById("presets");
for (const [label,val] of PRESETS){ const b=document.createElement("button"); b.className="preset"; b.textContent=label;
  b.addEventListener("click",()=>{ state.fwhm=val; fwhmEl.value=val; document.getElementById("fwhmOut").textContent=val.toFixed(2)+" nm"; Sconv=convolve(val); draw(); readouts(); });
  wrap.appendChild(b); }

cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, W=r.width;
  if (x>PADL && x<W-PADR){ hoverX=WL0+(x-PADL)/(W-PADL-PADR)*(WL1-WL0);
    const s=Sat(hoverX), ratio=1+state.sif/s;
    hv.style.display="block"; hv.style.left=Math.min(x+14,W-220)+"px"; hv.style.top="14px";
    hv.innerHTML="λ <b>"+hoverX.toFixed(2)+"</b> nm<br>transmission "+s.toFixed(2)+" · ratio "+ratio.toFixed(4);
  } else { hoverX=null; hv.style.display="none"; }
  draw();
});
cv.addEventListener("pointerleave",()=>{ hoverX=null; hv.style.display="none"; draw(); });

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(draw,80); });
draw(); readouts();
</script>
